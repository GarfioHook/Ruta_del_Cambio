<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Ulises - Acceso</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
    
    <!-- NUEVAS FUENTES: Playfair Display (Títulos) y Lato (Textos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* NUEVA PALETA DE COLORES "LA ODISEA" */
            --bg-parchment: #F5F4EF;
            --bg-parchment-dark: #E8E2D2;
            --navy-dark: #0F2035;
            --navy-light: #1B365D;
            --gold-primary: #C5A059;
            --gold-light: #E6C875;
            --text-dark: #112B47;
            --text-gray: #5C6E80;
            --accent-red: #8B3A3A;
            --silver: #8A9AAB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            /* FONDO DE IMAGEN: Pergamino Blueprint */
            background-color: var(--bg-parchment);
            background-image: url('img/Background.webp'); /* REEMPLAZA CON TU IMAGEN */
            background-size: cover;
            background-position: center;
            font-family: 'Lato', sans-serif;
            min-height: 100vh;
            width: 100vw;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1, h2, h3, .serif-text {
            font-family: 'Playfair Display', serif;
        }

        /* Contenedor principal y Marco */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 1600px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Si tienes el marco naval exportado como PNG transparente */
        .frame-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('img/Fondo.webp'); /* REEMPLAZA CON TU IMAGEN */
            background-size: 100% 100%;
            pointer-events: none !important;
            z-index: 2;
        }

        /* --- LOGO / TÍTULO SUPERIOR --- */
        .header-titles {
            text-align: center;
            margin-bottom: 40px;
            z-index: 10;
        }
        .title-main {
            font-size: 64px; font-weight: 900; color: #FFFFFF;
            text-transform: uppercase; letter-spacing: 4px; margin: 0;
            text-shadow: 0 5px 15px rgba(0,0,0,0.9), 0 0 30px rgba(197, 160, 89, 0.8), 2px 2px 0px rgba(15, 32, 53, 0.8);
        }
        .title-sub {
            font-size: 28px; font-weight: 700; color: var(--gold-primary);
            margin: 5px 0 35px; opacity: 1;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9), 1px 1px 2px rgba(0,0,0,1);
        }

        @media (max-width: 768px) {
            .title-main { font-size: 32px; letter-spacing: 2px; }
            .title-sub { font-size: 18px; margin-bottom: 20px; }
        }

        /* --- PANELES ESTILO ODISEA (Placas con bordes y remaches) --- */
        .odyssey-panel {
            background: rgba(245, 244, 239, 0.95);
            border: 2px solid var(--navy-light);
            padding: 40px;
            position: relative;
            box-shadow: 0 15px 35px rgba(15, 32, 53, 0.2);
            z-index: 100 !important;
            width: 90%;
            max-width: 650px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .odyssey-panel { padding: 25px 20px; }
        }
        
        /* Borde interior doble */
        .odyssey-panel::before {
            content: ''; position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 1px solid var(--navy-light);
            pointer-events: none;
        }

        /* Remaches en las esquinas (Hechos con CSS para evitar cargar más imágenes) */
        .rivet {
            position: absolute; width: 10px; height: 10px;
            background: var(--gold-primary); border-radius: 50%;
            border: 1px solid #8c6d32; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.5), 1px 1px 2px rgba(0,0,0,0.4);
        }
        .r-tl { top: 12px; left: 12px; } .r-tr { top: 12px; right: 12px; }
        .r-bl { bottom: 12px; left: 12px; } .r-br { bottom: 12px; right: 12px; }

        .panel-title {
            font-size: 28px; font-weight: 800; color: var(--navy-dark);
            margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px;
        }

        /* --- INPUTS --- */
        .input-group { width: 100%; margin-bottom: 25px; position: relative; text-align: left;}
        .input-label { font-size: 14px; font-weight: 700; color: var(--text-gray); margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 1px;}
        
        .email-input {
            width: 100%; padding: 15px 15px 15px 20px; 
            border: 2px solid var(--silver); background: #fff;
            font-size: 18px; font-weight: 700; color: var(--navy-dark); outline: none; transition: 0.3s;
            font-family: 'Lato', sans-serif;
        }
        .email-input:focus { border-color: var(--gold-primary); box-shadow: 0 0 10px rgba(197, 160, 89, 0.3);}
        
        .dropdown {
            position: absolute; top: 100%; left: 0; width: 100%; background: #fff;
            border: 2px solid var(--gold-primary); border-top: none;
            padding: 12px 20px; font-size: 16px; font-weight: 700; color: var(--navy-dark);
            display: none; cursor: pointer; z-index: 20; box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        /* --- FICHA TRIPULANTE --- */
        .ficha-card {
            width: 100%; background: rgba(255,255,255,0.6); 
            padding: 15px 20px; display: flex; align-items: center; gap: 20px; 
            margin-bottom: 30px; border: 1px solid var(--silver);
            transition: 0.3s; position: relative;
        }
        .ficha-avatar {
            width: 70px; height: 70px; background: #E8E2D2; border-radius: 50%; 
            border: 2px solid var(--navy-light); display: flex; justify-content: center; align-items: center; 
            overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        .ficha-avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .ficha-avatar span { font-size: 30px; color: var(--silver); } /* Icono por defecto */

        .ficha-info { flex: 1; text-align: left;}
        .ficha-name { font-size: 22px; font-weight: 800; color: var(--navy-dark); margin-bottom: 4px; font-family: 'Playfair Display', serif;}
        .ficha-role { font-size: 14px; font-weight: 700; color: var(--text-gray); }
        
        .ficha-check {
            width: 30px; height: 30px; background: var(--gold-primary); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold;
            opacity: 0; transition: 0.3s; transform: scale(0.5); border: 2px solid #fff;
        }

        /* --- BOTÓN PRINCIPAL --- */
        .btn-access {
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-primary) 100%); 
            border: 2px solid var(--navy-dark);
            padding: 15px 40px; font-size: 18px; font-weight: 900; color: var(--navy-dark); 
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.5), 0 5px 15px rgba(17, 43, 71, 0.3);
            cursor: pointer; transition: 0.2s; width: 100%; font-family: 'Lato', sans-serif;
            opacity: 0.5; pointer-events: none;
        }
        .btn-access.active { opacity: 1; pointer-events: auto; }
        .btn-access.active:hover { background: linear-gradient(180deg, #F2D06B 0%, #D4AF37 100%); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(17, 43, 71, 0.4); }

        /* --- MODAL DE SELECCIÓN DE AVATARES --- */
        .avatar-gallery {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px;
            max-height: 250px; overflow-y: auto; padding: 10px; margin-bottom: 25px;
            background: rgba(255,255,255,0.5); border: 1px solid var(--silver);
        }

        @media (max-width: 768px) {
            .avatar-gallery { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 480px) {
            .avatar-gallery { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .avatar-option { width: 60px; height: 60px; }
        }
        .avatar-option {
            width: 70px; height: 70px; cursor: pointer; transition: 0.3s;
            border: 2px solid transparent; border-radius: 50%; overflow: hidden;
        }
        .avatar-option img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-option:hover { transform: scale(1.1); border-color: var(--silver); }
        .avatar-option.selected { border-color: var(--gold-primary); box-shadow: 0 0 15px rgba(197, 160, 89, 0.6); }

        /* --- VIDEO DE FONDO Y BOTON DE INICIO --- */
        .bg-video {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 0; opacity: 0.85; pointer-events: none;
        }

        .btn-start {
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-primary) 100%); 
            border: 4px solid var(--navy-dark); border-radius: 12px;
            padding: 20px 60px; font-size: 24px; font-weight: 900; color: var(--navy-dark); 
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.5), 0 10px 25px rgba(15, 32, 53, 0.6);
            cursor: pointer !important; transition: 0.3s; font-family: 'Lato', sans-serif;
            z-index: 100 !important; position: relative; pointer-events: auto !important;
        }
        @media (max-width: 768px) {
            .btn-start { padding: 15px 40px; font-size: 18px; }
        }
        .btn-start:hover {
            background: linear-gradient(180deg, #F2D06B 0%, #D4AF37 100%); 
            transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 35px rgba(15, 32, 53, 0.8);
        }

        /* --- SESIÓN ACTIVA Y FAST RE-ENTRY (0ms) --- */
        .active-session-card {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--gold-primary);
            padding: 20px; margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(15, 32, 53, 0.15);
            text-align: left; position: relative;
        }
        .active-session-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .active-badge {
            background: var(--navy-dark); color: var(--gold-light);
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; padding: 4px 10px; border-radius: 12px;
        }
        .active-session-body {
            display: flex; align-items: center; gap: 15px;
        }
        .btn-secondary {
            background: transparent; border: none; color: var(--text-gray);
            font-size: 13px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; margin-top: 12px;
            display: block; width: 100%; text-align: center; padding: 6px; transition: 0.2s;
        }
        .btn-secondary:hover { color: var(--navy-dark); text-decoration: underline; }

        /* --- TRIPULANTES RECORDADOS (CHIPS) --- */
        .remembered-crew-container {
            margin-bottom: 18px; text-align: left;
        }
        .remembered-crew-list {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
        }
        .crew-chip {
            background: #fff; border: 1px solid var(--silver);
            padding: 6px 14px; border-radius: 20px; font-size: 13px;
            font-weight: 700; color: var(--navy-dark); cursor: pointer;
            display: flex; align-items: center; gap: 6px; white-space: nowrap; transition: 0.2s;
        }
        .crew-chip:hover {
            border-color: var(--gold-primary); background: var(--bg-parchment);
            transform: translateY(-1px); box-shadow: 0 3px 8px rgba(15, 32, 53, 0.1);
        }

        /* --- CHIPS DE DOMINIO RÁPIDO --- */
        .domain-chips {
            display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;
        }
        .domain-chip {
            background: rgba(255, 255, 255, 0.9);
            border: 1px dashed var(--silver); color: var(--navy-light);
            font-size: 12px; font-weight: 700; padding: 5px 12px;
            border-radius: 4px; cursor: pointer; transition: 0.2s;
        }
        .domain-chip:hover {
            background: var(--navy-light); color: #fff; border-color: var(--navy-light);
        }

    </style>
</head>
<body>

<!-- Video Submarino/Odisea de Fondo -->
<video id="bgVideo" class="bg-video" autoplay loop muted playsinline>
    <source src="img/Video_Ulises.mp4" type="video/mp4">
</video>

<div class="game-container">
    
    <!-- Marco Decorativo (Si lo tienes exportado, si no, puedes borrar esta línea) -->
    <div class="frame-overlay"></div>

    <!-- Títulos -->
    <div class="header-titles">
        <h1 class="title-main">Proyecto Ulises</h1>
        <h2 class="title-sub serif-text">Nuestra Travesía hacia el Futuro</h2>
    </div>

    <!-- Botón de Inicio Central -->
    <button class="btn-start" id="btnStart" onclick="comenzarTravesia(event)">Comenzar Travesía</button>

    <!-- Panel Modal de Login -->
    <div class="odyssey-panel" id="loginPanel" style="display: none;">
        <div class="rivet r-tl"></div><div class="rivet r-tr"></div>
        <div class="rivet r-bl"></div><div class="rivet r-br"></div>

        <h2 class="panel-title">Manifiesto de Embarque</h2>

        <!-- Opción A: Sesión Activa Encontrada (Fast Re-Entry 0ms) -->
        <div id="activeSessionCard" class="active-session-card" style="display: none;">
            <div class="active-session-header">
                <span class="active-badge">Sesión Activa</span>
                <span style="font-size: 12px; color: var(--text-gray); font-weight: bold;">Acceso Rápido</span>
            </div>
            <div class="active-session-body">
                <div class="ficha-avatar" style="width: 55px; height: 55px;">
                    <span id="activeAvatarIcon">⚓</span>
                    <img id="activeAvatarImg" src="" alt="Avatar" style="display:none; width:100%; height:100%; object-fit:cover;">
                </div>
                <div class="ficha-info">
                    <div class="ficha-name" id="activeName" style="font-size: 20px;">---</div>
                    <div class="ficha-role" id="activeRole">---</div>
                </div>
            </div>
            <button class="btn-access active" id="btnResumeSession" style="margin-top: 15px;">Ingresar a mi Puesto de Mando ➔</button>
            <button class="btn-secondary" id="btnSwitchAccount" type="button">Ingresar con otro correo</button>
        </div>

        <!-- Opción B: Formulario de Identificación Manual / Nuevo Usuario -->
        <div id="manualLoginSection">
            <!-- Tripulantes recordados en este dispositivo -->
            <div id="rememberedCrewSection" class="remembered-crew-container" style="display: none;">
                <label class="input-label" style="font-size: 12px; margin-bottom: 6px;">Tripulantes Frecuentes en este equipo:</label>
                <div id="rememberedCrewList" class="remembered-crew-list"></div>
            </div>

            <div class="input-group">
                <label class="input-label">Ingresa tu Correo Corporativo</label>
                <input type="email" id="emailInput" class="email-input" placeholder="ejemplo@pjportland.cl" autocomplete="off">
                <div id="dropdown" class="dropdown"></div>
                <!-- Chips de sugerencias de dominio corporativo -->
                <div class="domain-chips" id="domainChips">
                    <button type="button" class="domain-chip" data-domain="@pjportland.cl">+ @pjportland.cl</button>
                    <button type="button" class="domain-chip" data-domain="@pjepoxa.cl">+ @pjepoxa.cl</button>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Identificación de Tripulante</label>
                <div class="ficha-card" id="fichaCard">
                    <div class="ficha-avatar">
                        <span id="defaultAvatarIcon">⚓</span>
                        <img id="fichaAvatarImg" src="" alt="Avatar">
                    </div>
                    <div class="ficha-info">
                        <div class="ficha-name" id="fichaName">---</div>
                        <div class="ficha-role" id="fichaRole">Esperando identificación...</div>
                    </div>
                    <div class="ficha-check" id="fichaCheck">✓</div>
                </div>
            </div>

            <button class="btn-access" id="btnAccess">Iniciar Travesía</button>
        </div>
    </div>

    <!-- Modal de Personalización (Aparece tras validar el correo si no tiene avatar) -->
    <div class="odyssey-panel" id="profilePanel" style="display: none; position: absolute;">
        <div class="rivet r-tl"></div><div class="rivet r-tr"></div>
        <div class="rivet r-bl"></div><div class="rivet r-br"></div>

        <h2 class="panel-title">Registra tu Identidad</h2>
        <p style="color: var(--text-gray); margin-bottom: 20px; font-style: italic;">Selecciona el retrato que te representará en esta travesía.</p>
        
        <div class="input-group">
            <label class="input-label">Tu Alias o Apodo Náutico</label>
            <input type="text" id="aliasInput" class="email-input" placeholder="Ej: Capitán Trueno, Vigía del Sur..." maxlength="21">
        </div>

        <label class="input-label">Selecciona tu Avatar</label>
        <div class="avatar-gallery" id="avatarGallery">
            <!-- REEMPLAZA ESTOS SRC CON LOS NOMBRES REALES DE TUS AVATARES EN LA CARPETA IMG -->
            <div class="avatar-option" data-avatar="img/Avatar01.webp"><img src="img/Avatar01.webp" alt="Avatar 1"></div>
            <div class="avatar-option" data-avatar="img/Avatar02.webp"><img src="img/Avatar02.webp" alt="Avatar 2"></div>
            <div class="avatar-option" data-avatar="img/Avatar03.webp"><img src="img/Avatar03.webp" alt="Avatar 3"></div>
            <div class="avatar-option" data-avatar="img/Avatar04.webp"><img src="img/Avatar04.webp" alt="Avatar 4"></div>
            <div class="avatar-option" data-avatar="img/Avatar05.webp"><img src="img/Avatar05.webp" alt="Avatar 5"></div>
            <div class="avatar-option" data-avatar="img/Avatar06.webp"><img src="img/Avatar06.webp" alt="Avatar 6"></div>
            <div class="avatar-option" data-avatar="img/Avatar07.webp"><img src="img/Avatar07.webp" alt="Avatar 7"></div>
            <div class="avatar-option" data-avatar="img/Avatar08.webp"><img src="img/Avatar08.webp" alt="Avatar 8"></div>            
            <div class="avatar-option" data-avatar="img/Avatar09.webp"><img src="img/Avatar09.webp" alt="Avatar 9"></div>
            <div class="avatar-option" data-avatar="img/Avatar10.webp"><img src="img/Avatar10.webp" alt="Avatar 10"></div>                        
            
            <!-- Duplica esta línea para añadir los 18 avatares que tienes -->
        </div>

        <button class="btn-access active" id="btnSaveProfile">Zarpar</button>
    </div>

</div>

<!-- SCRIPT DE LÓGICA (Se mantiene igual, solo cambia IDs para referenciar imágenes) -->
<script src="scripts/core.js"></script>
<script>
    let tripulantes = [];
    let currentUser = null;
    let currentRole = null;
    // Cache de la validación del webhook para el usuario actual
    let webhookVisaCache = null;
    let webhookFetchInProgress = false;

    const webhookEndpoint = (window.Core && window.Core.WEBHOOK_URL) ? window.Core.WEBHOOK_URL : 'https://script.google.com/macros/s/AKfycbxcp3HlO-f4tK8h5pcQMaBPqecOAH-4UY2lfRcUkEl8oSQYTPqKyoHWm5ksop3EMRKKmQ/exec';

    document.addEventListener('DOMContentLoaded', () => {
        // Establecer el video a cámara lenta (50%)
        const bgVideo = document.getElementById('bgVideo');
        if (bgVideo) bgVideo.playbackRate = 0.5;

        // Comprobar si se solicitó logout explícito en la URL (?logout=true)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
            currentUser = null;
            currentRole = null;
            webhookVisaCache = null;
            localStorage.removeItem('portland_user');
            localStorage.removeItem('portland_role');
        } else {
            // Revisar si existe una sesión activa persistente para Fast Re-Entry
            const activeUserStr = localStorage.getItem('portland_user');
            const activeRole = localStorage.getItem('portland_role');
            if (activeUserStr && activeRole) {
                try {
                    const parsedUser = JSON.parse(activeUserStr);
                    currentUser = parsedUser;
                    currentRole = activeRole;
                    mostrarSesionActiva(parsedUser, activeRole);

                    // Actualizar botón de inicio con bienvenida personalizada
                    const btnStart = document.getElementById('btnStart');
                    if (btnStart) {
                        const shortName = (Core.formatName(parsedUser) || '').split(' ')[0];
                        btnStart.innerHTML = `Continuar como ${shortName} ⚓`;
                    }
                } catch (e) {}
            }
        }

        renderizarTripulantesRecordados();
    });

    function comenzarTravesia(e) {
        if (e && e.preventDefault) e.preventDefault();
        const btn = document.getElementById('btnStart');
        const panel = document.getElementById('loginPanel');
        if (btn) btn.style.display = 'none';
        if (panel) {
            panel.style.display = 'block';
            const emailInp = document.getElementById('emailInput');
            if (emailInp) setTimeout(() => emailInp.focus(), 80);
        }
    }
    window.comenzarTravesia = comenzarTravesia;

    const btnStart = document.getElementById('btnStart');
    const loginPanel = document.getElementById('loginPanel');

    if (btnStart) {
        btnStart.addEventListener('click', comenzarTravesia);
        btnStart.addEventListener('pointerdown', comenzarTravesia);
    }

    const input = document.getElementById('emailInput');
    const dropdown = document.getElementById('dropdown');
    const fichaCard = document.getElementById('fichaCard');
    const fichaName = document.getElementById('fichaName');
    const fichaRole = document.getElementById('fichaRole');
    const fichaCheck = document.getElementById('fichaCheck');
    const btnAccess = document.getElementById('btnAccess');
    const defaultAvatarIcon = document.getElementById('defaultAvatarIcon');
    const fichaAvatarImg = document.getElementById('fichaAvatarImg');

    /**
     * Actualiza la ficha del tripulante visualmente.
     */
    function updateFichaVisual(alias, avatar) {
        const fichaAvatarImg = document.getElementById('fichaAvatarImg');
        const defaultAvatarIcon = document.getElementById('defaultAvatarIcon');
        const fichaRole = document.getElementById('fichaRole');
        const fichaCard = document.getElementById('fichaCard');
        const fichaCheck = document.getElementById('fichaCheck');

        if (avatar && (avatar.includes('img/') || avatar.includes('.webp') || avatar.includes('.png'))) {
            defaultAvatarIcon.style.display = 'none';
            fichaAvatarImg.src = avatar;
            fichaAvatarImg.style.display = 'block';
        } else if (avatar) {
            defaultAvatarIcon.textContent = avatar;
            defaultAvatarIcon.style.display = 'block';
            fichaAvatarImg.style.display = 'none';
        } else {
            defaultAvatarIcon.textContent = '⚓';
            defaultAvatarIcon.style.display = 'block';
            fichaAvatarImg.style.display = 'none';
        }

        if (alias && currentRole) {
            fichaRole.textContent = `${currentRole} - "${alias}"`;
        } else if (currentRole) {
            fichaRole.textContent = `${currentRole} - Rango: Oficial`;
        }

        if (currentUser) {
            fichaCard.style.borderColor = 'var(--gold-primary)';
            fichaCheck.style.opacity = '1';
            fichaCheck.style.transform = 'scale(1)';
        }
    }

    let searchDebounceTimer = null;
    let lastSearchedEmail = '';

    let currentAbortController = null;

    /**
     * Muestra la tarjeta de sesión activa persistente permitiendo entrada en 0ms.
     */
    function mostrarSesionActiva(user, role) {
        const activeCard = document.getElementById('activeSessionCard');
        const manualSec = document.getElementById('manualLoginSection');
        const activeName = document.getElementById('activeName');
        const activeRole = document.getElementById('activeRole');
        const activeAvatarImg = document.getElementById('activeAvatarImg');
        const activeAvatarIcon = document.getElementById('activeAvatarIcon');

        if (!activeCard || !user) return;

        const profile = Core.getProfile(user.Email);
        const displayAlias = profile.aliasUsuario || user.Alias || '';
        const displayName = Core.formatName(user);

        if (activeName) activeName.textContent = displayName;
        if (activeRole) {
            activeRole.textContent = displayAlias ? `${role} - "${displayAlias}"` : `${role} - Rango Oficial`;
        }

        const avatar = profile.avatarUsuario || user.Avatar;
        if (avatar && (avatar.includes('img/') || avatar.includes('.webp') || avatar.includes('.png'))) {
            if (activeAvatarIcon) activeAvatarIcon.style.display = 'none';
            if (activeAvatarImg) {
                activeAvatarImg.src = avatar;
                activeAvatarImg.style.display = 'block';
            }
        } else if (avatar) {
            if (activeAvatarIcon) {
                activeAvatarIcon.textContent = avatar;
                activeAvatarIcon.style.display = 'block';
            }
            if (activeAvatarImg) activeAvatarImg.style.display = 'none';
        }

        activeCard.style.display = 'block';
        if (manualSec) manualSec.style.display = 'none';
    }

    /**
     * Renderiza botones de acceso rápido para tripulantes recordados en este dispositivo.
     */
    function renderizarTripulantesRecordados() {
        const listContainer = document.getElementById('rememberedCrewList');
        const sectionContainer = document.getElementById('rememberedCrewSection');
        if (!listContainer || !sectionContainer) return;

        const crew = (Core.getRememberedCrew) ? Core.getRememberedCrew() : [];
        if (!crew || crew.length === 0) {
            sectionContainer.style.display = 'none';
            return;
        }

        listContainer.innerHTML = '';
        crew.forEach(member => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'crew-chip';
            chip.innerHTML = `<span>⚓</span> <span>${member.name || member.email}</span>`;
            chip.title = `${member.role || 'Tripulante'} - ${member.email}`;
            chip.onclick = () => {
                input.value = member.email;
                buscarYValidarTripulante(member.email, true);
            };
            listContainer.appendChild(chip);
        });
        sectionContainer.style.display = 'block';
    }

    /**
     * Aplica los datos de usuario a la ficha visual y activa el botón de acceso.
     */
    function aplicarDatosUsuarioAFicha(userObj, role, alias, avatar, hasVisa) {
        currentUser = userObj;
        currentRole = role || userObj.Rango || 'Tripulante';

        fichaName.textContent = Core.formatName(currentUser);

        const cleanAlias = (alias || currentUser.Alias || '').trim();
        const cleanAvatar = (avatar || currentUser.Avatar || '').trim();

        if (cleanAlias) {
            Core.saveProfile(cleanAlias, cleanAvatar || 'img/Avatar01.webp', currentUser.Email);
        }

        if (hasVisa || (currentUser['Visa de Zarpe'] && currentUser['Visa de Zarpe'].toString().toLowerCase() === 'si')) {
            webhookVisaCache = true;
            localStorage.setItem('portland_visa1_accepted_' + currentUser.Email, 'true');
        } else {
            webhookVisaCache = !!localStorage.getItem('portland_visa1_accepted_' + currentUser.Email);
        }

        const profile = Core.getProfile(currentUser.Email);
        const displayAliasText = cleanAlias || profile.aliasUsuario || '';

        if (displayAliasText && currentRole) {
            fichaRole.textContent = `${currentRole} - "${displayAliasText}"`;
        } else if (currentRole) {
            fichaRole.textContent = `${currentRole} - Rango: Oficial`;
        }

        updateFichaVisual(displayAliasText, profile.avatarUsuario || cleanAvatar);

        btnAccess.classList.add('active');
        btnAccess.textContent = 'Iniciar Travesía';
        dropdown.style.display = 'none';
    }

    /**
     * Busca y valida el usuario individual.
     * Implementa UI Optimista (0ms en usuarios de caché local) y AbortController para llamadas de red.
     */
    async function buscarYValidarTripulante(email, isManualSubmit = false) {
        const cleanEmail = (email || '').trim().toLowerCase();
        
        // Validación de formato de correo para evitar peticiones prematuras
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const looksLikeEmail = emailRegex.test(cleanEmail);

        if (!cleanEmail || (!looksLikeEmail && !isManualSubmit)) {
            if (!cleanEmail) resetFicha();
            return;
        }

        if (cleanEmail === lastSearchedEmail && currentUser) {
            return;
        }

        lastSearchedEmail = cleanEmail;

        // 1. REVISIÓN EN CACHÉ LOCAL (0ms): Si ya se autenticó antes en este equipo, mostrar de inmediato
        const localCached = Core.getLocalCachedUser ? Core.getLocalCachedUser(cleanEmail) : null;
        if (localCached && localCached.success && localCached.user) {
            aplicarDatosUsuarioAFicha(
                localCached.user,
                localCached.role,
                localCached.alias,
                localCached.avatar,
                localCached.hasVisa
            );
            if (isManualSubmit) return;
        } else {
            btnAccess.classList.remove('active');
            btnAccess.textContent = 'Verificando bitácora...';
            fichaRole.textContent = 'Consultando rol de navegación...';
        }

        // Cancelar petición anterior si el usuario sigue tecleando
        if (currentAbortController) {
            currentAbortController.abort();
        }
        currentAbortController = new AbortController();
        webhookFetchInProgress = true;

        try {
            const data = await Core.getUserFromBackend(cleanEmail, currentAbortController.signal);

            if (data && data.aborted) {
                return; // Petición abortada por nuevo tecleo
            }

            if (data && data.success && data.user) {
                aplicarDatosUsuarioAFicha(
                    data.user,
                    data.role,
                    data.alias,
                    data.avatar,
                    data.hasVisa
                );
            } else {
                if (!localCached) {
                    resetFicha();
                    fichaName.textContent = 'No Encontrado';
                    fichaRole.textContent = 'Correo no registrado en la tripulación';
                    btnAccess.textContent = 'Iniciar Travesía';
                }
            }
        } catch (err) {
            if (err.name !== 'AbortError') {
                console.error('Error al validar tripulante:', err);
                if (!localCached) {
                    resetFicha();
                    fichaRole.textContent = 'Error de conexión con bitácora';
                    btnAccess.textContent = 'Iniciar Travesía';
                }
            }
        } finally {
            webhookFetchInProgress = false;
        }
    }

    function resetFicha() {
        currentUser = null;
        currentRole = null;
        webhookVisaCache = null;
        fichaName.textContent = '---';
        fichaRole.textContent = 'Esperando identificación...';
        defaultAvatarIcon.style.display = 'block';
        fichaAvatarImg.style.display = 'none';
        fichaCard.style.borderColor = 'var(--silver)';
        fichaCheck.style.opacity = '0';
        fichaCheck.style.transform = 'scale(0.5)';
        btnAccess.classList.remove('active');
    }

    input.addEventListener('input', function() {
        const value = this.value.toLowerCase().trim();
        
        if (value.length > 3) {
            dropdown.style.display = 'block';
            dropdown.textContent = value; 
        } else {
            dropdown.style.display = 'none';
        }

        clearTimeout(searchDebounceTimer);
        // Validar solo si tiene formato completo de correo para no sobrecargar el servidor
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (emailRegex.test(value)) {
            searchDebounceTimer = setTimeout(() => {
                buscarYValidarTripulante(value);
            }, 300);
        } else {
            // Si el correo está incompleto y teníamos un usuario cargado, resetear
            if (currentUser && !value.includes('@')) {
                resetFicha();
            }
        }
    });

    // Validación inmediata al presionar Enter en el input
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            clearTimeout(searchDebounceTimer);
            buscarYValidarTripulante(this.value.trim(), true);
        }
    });

    // Manejo de chips de dominio rápido (+ @pjportland.cl, + @pjepoxa.cl)
    document.querySelectorAll('.domain-chip').forEach(btn => {
        btn.addEventListener('click', () => {
            const domain = btn.getAttribute('data-domain');
            let currentVal = input.value.trim();
            if (currentVal.includes('@')) {
                currentVal = currentVal.split('@')[0];
            }
            if (currentVal) {
                input.value = currentVal + domain;
                dropdown.style.display = 'none';
                buscarYValidarTripulante(input.value, true);
            } else {
                input.focus();
            }
        });
    });

    // Reanudar sesión activa (Fast Re-Entry)
    const btnResumeSession = document.getElementById('btnResumeSession');
    if (btnResumeSession) {
        btnResumeSession.addEventListener('click', () => {
            if (currentUser && currentRole) {
                redirectByRole(currentRole);
            }
        });
    }

    // Cambiar de cuenta desde la pantalla de bienvenida
    const btnSwitchAccount = document.getElementById('btnSwitchAccount');
    if (btnSwitchAccount) {
        btnSwitchAccount.addEventListener('click', () => {
            currentUser = null;
            currentRole = null;
            webhookVisaCache = null;
            localStorage.removeItem('portland_user');
            localStorage.removeItem('portland_role');
            const activeCard = document.getElementById('activeSessionCard');
            const manualSec = document.getElementById('manualLoginSection');
            if (activeCard) activeCard.style.display = 'none';
            if (manualSec) manualSec.style.display = 'block';
            resetFicha();
            const btnStart = document.getElementById('btnStart');
            if (btnStart) btnStart.innerHTML = 'Comenzar Travesía';
            input.value = '';
            setTimeout(() => input.focus(), 80);
        });
    }

    btnAccess.addEventListener('click', async function() {
        // Si aún no se ha validado pero hay un email escrito en el input, validarlo primero
        if (!currentUser && input.value.trim().includes('@')) {
            await buscarYValidarTripulante(input.value.trim());
        }

        if (currentUser && currentRole) {
            Core.saveSession(currentUser, currentRole);
            
            const profile = Core.getProfile(currentUser.Email);
            // El alias debe ser estrictamente del usuario actual
            const userAlias = (currentUser.Alias || '').trim() || (profile.aliasUsuario || '').trim();
            const visaKey = 'portland_visa1_accepted_' + currentUser.Email;
            const hasAcceptedZarpe = !!localStorage.getItem(visaKey) || 
                                     (currentUser['Visa de Zarpe'] && currentUser['Visa de Zarpe'].toString().toLowerCase() === 'si') || 
                                     webhookVisaCache === true;

            // CONDICIÓN CLAVE:
            // Si el tripulante NO tiene un Alias definido, SIEMPRE se le debe solicitar que lo cree
            if (!userAlias) {
                const aliasInput = document.getElementById('aliasInput');
                if (aliasInput) {
                    aliasInput.value = '';
                }
                document.getElementById('loginPanel').style.display = 'none';
                document.getElementById('profilePanel').style.display = 'block';
                return;
            }

            // Si ya tiene un Alias definido, verificar si aceptó los TyC / Visa de Zarpe
            redirectByRole(currentRole);
        }
    });

    // Lógica del Modal de Selección de Imágenes de Avatar
    let selectedAvatarImg = null;
    const avatarOptions = document.querySelectorAll('.avatar-option');
    avatarOptions.forEach(opt => {
        opt.onclick = () => {
            avatarOptions.forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            selectedAvatarImg = opt.dataset.avatar;
        };
    });

    document.getElementById('btnSaveProfile').addEventListener('click', () => {
        const alias = document.getElementById('aliasInput').value.trim();
        if (!alias) return alert('Por favor, ingresa un alias náutico.');
        const avatarToSave = selectedAvatarImg || 'img/Avatar01.webp';

        if (currentUser) {
            currentUser.Alias = alias;
        }
        Core.saveProfile(alias, avatarToSave, currentUser ? currentUser.Email : null);
        
        redirectByRole(currentRole);
    });

    async function redirectByRole(role) {
        const visaKey = 'portland_visa1_accepted_' + currentUser.Email;
        
        // 1. Verificar si está en memoria local o en los datos del usuario
        let hasAcceptedZarpe = !!localStorage.getItem(visaKey) || 
                               (currentUser['Visa de Zarpe'] && currentUser['Visa de Zarpe'].toString().toLowerCase() === 'si') ||
                               webhookVisaCache === true;
        
        // 2. Si no está local, el Webhook ya debió responder (gracias a la espera en el botón de acceso)
        if (!hasAcceptedZarpe && webhookVisaCache === true) {
            hasAcceptedZarpe = true;
        }

        if (!hasAcceptedZarpe) {
            window.location.href = 'VISA DE ZARPE.html';
            return;
        }
        
        if (role === 'Almirante') window.location.href = 'Almirante.html';
        else if (role === 'Capitan') window.location.href = 'Capitan.html';
        else window.location.href = 'Tripulante.html';
    }

    dropdown.addEventListener('click', function() {
        input.value = this.textContent;
        input.dispatchEvent(new Event('input'));
    });

</script>
